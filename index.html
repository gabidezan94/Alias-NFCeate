
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alias NFCEATE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 70px 20px;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 15px #0002;
    }
    button {
      background: #222;
      color: white;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }
    #mensaje { color: green; }
  </style>
</head>
<body>
  <div class="card">
    <h2>NFCEATE</h2>
    <p>Alias para transferencias</p>
    <h3 id="alias">NFCeate</h3>
    <button onclick="copiar()">Copiar alias</button>
    <p id="mensaje"></p>
  </div>
  <script>
    async function copiar() {
      try {
        await navigator.clipboard.writeText("NFCeate");
        document.getElementById("mensaje").innerText =
          "¡Alias copiado correctamente!";
      } catch (error) {
        document.getElementById("mensaje").innerText =
          "No se pudo copiar. Seleccioná el alias manualmente.";
      }
    }
  </script>
</body>
</html>
